<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <title>Register</title>
</head>
<body>
    <header class="w-full bg-[#ffc2d1]">
      <a href="index.html" class="capitalize font-['Great_Vibes'] font-normal font-400 text-5xl p-8 inline-block text-[#800f2f]">pure skin</a>
    </header>

    <div class="login_form w-[80%] bg-[#ffc2d1] p-10 ">
        <label for="firstName">firstName</label>
        <input type="text" placeholder="Enter first name" id="firstName">

        <label for="lastName">lastName</label>
        <input type="text" placeholder="Enter last name" id="lastName">
         
         
        <label for="email">Email</label> 
        <input type="email" placeholder="Enter email" id="email">
         
        <label for="password">password</label>
        <input type="password" placeholder="Enter password" id="password">

        
        <button class="rounded-lg block bg-[#db6687] w-20 h-12 text-[#ddd] my-8">Register</button>
        <p class="text-stone-600">Have an account? <a href="login.html" class="text-[#701818] ml-8 hover:underline hover:text-[#f11146]" >Login</a></p>
    </div>       <!--/login_form-->


    
    <script src="js/Register.js"></script> 
    <script src="js/user.js"></script>
</body>
</html>
